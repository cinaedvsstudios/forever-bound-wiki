<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storyboarder</title>
  <link rel="icon" href="storyboarder.png" />
  <link rel="stylesheet" href="storyboarder.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar topbar-v3">
      <div class="brand-block">
        <img class="app-logo" src="storyboarder.png" alt="Storyboarder logo" />
        <div>
          <div class="eyebrow">Capsanoto adjacent tool</div>
          <h1>Storyboarder</h1>
        </div>
      </div>

      <div class="top-control-strip" aria-label="Storyboarder controls">
        <div class="custom-select episode-select-widget" id="episodeSelectWidget">
          <button id="episodeSelectButton" type="button" class="custom-select-button" aria-haspopup="listbox" aria-expanded="false">Episode 1 — The Curse Begins ▾</button>
          <div id="episodeSelectMenu" class="custom-select-menu hidden" role="listbox"></div>
        </div>

        <button id="btnLoadSample" type="button">🧪 Sample</button>
        <label class="file-button">
          📥 JSON
          <input id="jsonInput" type="file" accept=".json,application/json" />
        </label>
        <label class="file-button subdued">
          📜 Script
          <input id="scriptInput" type="file" accept=".md,.markdown,text/markdown,text/plain" />
        </label>
        <button id="btnExport" type="button">📤 Export</button>
      </div>
    </header>

    <section class="episode-hero compact-hero compact-hero-v3">
      <div class="episode-title-row compact-title-row compact-title-row-v3">
        <div class="episode-title-block">
          <div class="episode-meta-line">
            <div class="episode-number" id="episodeNumber">Episode 01</div>
            <div class="custom-status" id="episodeStatusWidget">
              <button id="episodeStatusButton" type="button" class="status-pill" aria-haspopup="listbox" aria-expanded="false">Not Started ▾</button>
              <div id="episodeStatusMenu" class="status-menu hidden" role="listbox"></div>
            </div>
          </div>
          <h2 id="episodeTitle">The Curse Begins</h2>
        </div>

        <nav class="jump-nav compact-jump-nav" id="jumpNav" aria-label="Episode jump navigator"></nav>
      </div>
    </section>

    <div class="workspace">
      <aside class="left-panel left-panel-v3">
        <section class="panel-card icon-panel">
          <div class="view-switch">
            <button type="button" data-view-mode="overview">🧭 Overview</button>
            <button type="button" data-view-mode="act">🎬 Acts</button>
            <button type="button" data-view-mode="scene">🧩 Scenes</button>
          </div>

          <div class="left-divider"></div>

          <button id="btnFolderPlan" type="button" class="wide-button">📂 Plan</button>
          <button id="btnCreateFolders" type="button" class="wide-button">🗂️ Create</button>
          <button id="btnOpenEffectsLibrary" type="button" class="wide-button">✨ Effects</button>
          <button id="btnClearLocal" type="button" class="wide-button danger">🧹 Clear</button>
        </section>

        <section class="panel-card icon-panel filter-panel">
          <input id="sceneSearch" type="search" placeholder="🔎 Search" />
          <div class="custom-select filter-select-widget" id="statusFilterWidget">
            <button id="statusFilterButton" type="button" class="custom-select-button" aria-haspopup="listbox" aria-expanded="false">🚦 All ▾</button>
            <div id="statusFilterMenu" class="custom-select-menu hidden" role="listbox"></div>
          </div>
        </section>

        <section class="panel-card icon-panel validation-card">
          <button id="validationToggle" type="button" class="wide-button validation-toggle">⚠️ Issues</button>
          <div id="validationList" class="validation-list compact-validation"></div>
        </section>
      </aside>

      <main class="scene-stage" id="sceneStage" tabindex="-1"></main>
    </div>
  </div>

  <div class="floating-window hidden" id="scriptWindow" role="dialog" aria-label="Script preview">
    <div class="floating-header" id="scriptWindowHeader">
      <strong id="scriptWindowTitle">Script Preview</strong>
      <div class="floating-actions">
        <button id="btnScriptPopout" type="button" title="Show full loaded script">Full script</button>
        <button id="btnCloseScript" type="button" title="Close">×</button>
      </div>
    </div>
    <div class="floating-body" id="scriptPreview"></div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <template id="mediaTileTemplate">
    <article class="media-tile">
      <div class="media-preview"></div>
      <div class="media-meta">
        <strong class="media-label"></strong>
        <span class="media-type"></span>
      </div>
      <div class="media-controls">
        <button type="button" data-media-action="play" title="Play">▶</button>
        <button type="button" data-media-action="stop" title="Stop">■</button>
        <button type="button" data-media-action="download" title="Download">⬇</button>
        <button type="button" data-media-action="folder" title="Folder">📁</button>
        <button type="button" data-media-action="remove" title="Remove">×</button>
      </div>
    </article>
  </template>

  <script src="storyboarder.js"></script>
</body>
</html>
